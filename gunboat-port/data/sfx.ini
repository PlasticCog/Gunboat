# Gunboat: the AdLib sound effects (edit with gunboat_sfx_editor).
# An operator is: attack decay sustain release multiple level waveform ksl tremolo vibrato
# sustained ksr (the OPL2's fields). output = adlib | speaker | silent. notes = own, or the
# driver program 0-12 whose notes it plays. bend = the pitch bend, ms:cents points after the
# effect starts (or none).

